<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Document</title>
</head>

<body>
    <h1>Lista de Usuarios</h1>
    <div style="margin-bottom: 20px;">
        <input type="text" id="buscador" placeholder="Buscar usuario por nombre...">
    </div>

    <ul id="lista-usuarios"></ul>
    <ul id="lista-usuarios"></ul>

    <div id="perfil-contenedor">
        <h2>Perfil de Usuario Detallado (Punto 4)</h2>
        <div id="ficha-usuario" class="usuario-card">
            <p>Cargando información del usuario...</p>
        </div>
    </div>

    <hr>
    <div id="punto-5">
        <h2>Crear Nuevo Usuario (Punto 5)</h2>
        <form id="formulario-usuario">
            <input type="text" id="nuevo-nombre" placeholder="Nombre completo">
            <input type="email" id="nuevo-email" placeholder="Correo electrónico">
            <button type="submit" id="crear-usuario">
                Crear Usuario
            </button>
        </form>
        <p id="mensaje-servidor" style="margin-top: 15px; font-weight: bold;"></p>
    </div>

    <script src="java.js"></script>
</body>

</html>
